<title>Mis postulaciones</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Liquid-glass look borrowed from NutriVerse (silver, Outfit) in light mode and Gym Tracker (black glass, orange) in dark mode.
   Layout: hero (gauge + 4 key numbers), stage funnel, filter chips, then one glass row per application with its link and stage picker. */
:root {
  --bg-a: #f4f6f8; --bg-b: #e3e8ec; --bg-c: #dde3e7;
  --wave: rgba(255, 255, 255, .85);
  --ink: #1f2428; --ink-2: #3c444c; --muted: #6f7882; --faint: #9aa1ab;
  --glass-top: rgba(255, 255, 255, .66); --glass-mid: rgba(255, 255, 255, .36); --glass-bot: rgba(255, 255, 255, .52);
  --rim: rgba(255, 255, 255, 1); --rim-soft: rgba(255, 255, 255, .25);
  --edge: rgba(90, 104, 120, .22);
  --shadow: 0 1px 1.5px rgba(40, 52, 64, .1), 0 14px 30px -16px rgba(40, 52, 64, .42);
  --field: rgba(255, 255, 255, .7);
  --accent: #2e9e5b; --accent-hi: #5bd68a; --accent-ink: #1e6e41; --accent-soft: rgba(46, 158, 91, .13);
  --amber: #c98a1b; --amber-soft: rgba(217, 154, 43, .16);
  --coral: #d24a33; --coral-soft: rgba(224, 87, 63, .13);
  --violet: #7a69cf; --violet-soft: rgba(143, 127, 216, .16);
  --slate: #5f6b76; --slate-soft: rgba(95, 107, 118, .12);
  --good: #2e9e5b; --good-soft: rgba(46, 158, 91, .14);
  --track: rgba(60, 68, 76, .12);
  --scrim: rgba(30, 36, 42, .28);
  --font: "Outfit", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --r: 26px; --r-sm: 16px;
  --spring: cubic-bezier(.34, 1.56, .64, 1); --ease: cubic-bezier(.22, 1, .36, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg-a: #0c0c0c; --bg-b: #070707; --bg-c: #050505; --wave: rgba(255, 120, 70, .10);
    --ink: #f3f3f1; --ink-2: #d4d4cf; --muted: #9a9a94; --faint: #6c6c67;
    --glass-top: rgba(34, 34, 34, .62); --glass-mid: rgba(22, 22, 22, .5); --glass-bot: rgba(26, 26, 26, .58);
    --rim: rgba(255, 255, 255, .34); --rim-soft: rgba(255, 255, 255, .05); --edge: rgba(255, 255, 255, .1);
    --shadow: 0 10px 36px rgba(0, 0, 0, .45); --field: rgba(255, 255, 255, .06);
    --accent: #ff6a3d; --accent-hi: #ff9a6b; --accent-ink: #ffb08f; --accent-soft: rgba(255, 106, 61, .16);
    --amber: #f0bf5a; --amber-soft: rgba(240, 191, 90, .14); --coral: #ff7a6b; --coral-soft: rgba(255, 92, 92, .15);
    --violet: #a99bf0; --violet-soft: rgba(169, 155, 240, .16); --slate: #a3a39d; --slate-soft: rgba(255, 255, 255, .07); --good: #5bd68a; --good-soft: rgba(91, 214, 138, .14);
    --track: rgba(255, 255, 255, .09); --scrim: rgba(0, 0, 0, .55); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg-a: #0c0c0c; --bg-b: #070707; --bg-c: #050505; --wave: rgba(255, 120, 70, .10);
  --ink: #f3f3f1; --ink-2: #d4d4cf; --muted: #9a9a94; --faint: #6c6c67;
  --glass-top: rgba(34, 34, 34, .62); --glass-mid: rgba(22, 22, 22, .5); --glass-bot: rgba(26, 26, 26, .58);
  --rim: rgba(255, 255, 255, .34); --rim-soft: rgba(255, 255, 255, .05); --edge: rgba(255, 255, 255, .1);
  --shadow: 0 10px 36px rgba(0, 0, 0, .45); --field: rgba(255, 255, 255, .06);
  --accent: #ff6a3d; --accent-hi: #ff9a6b; --accent-ink: #ffb08f; --accent-soft: rgba(255, 106, 61, .16);
  --amber: #f0bf5a; --amber-soft: rgba(240, 191, 90, .14); --coral: #ff7a6b; --coral-soft: rgba(255, 92, 92, .15);
  --violet: #a99bf0; --violet-soft: rgba(169, 155, 240, .16); --slate: #a3a39d; --slate-soft: rgba(255, 255, 255, .07); --good: #5bd68a; --good-soft: rgba(91, 214, 138, .14);
  --track: rgba(255, 255, 255, .09); --scrim: rgba(0, 0, 0, .55); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100vh; color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
  background: var(--bg-b);
}
.bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none;
  background:
    radial-gradient(120% 70% at 15% -10%, var(--wave), transparent 55%),
    radial-gradient(70% 50% at 100% 25%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 60%),
    radial-gradient(60% 45% at 0% 90%, color-mix(in srgb, var(--violet) 12%, transparent), transparent 60%),
    linear-gradient(170deg, var(--bg-a) 0%, var(--bg-b) 50%, var(--bg-c) 100%); }
.bg i { position: absolute; width: 160%; height: 42%; left: -30%; border-radius: 50%; filter: blur(46px); opacity: .55;
  background: linear-gradient(90deg, transparent, var(--wave), transparent); }
.bg i:nth-child(1) { top: 8%; transform: rotate(-8deg); }
.bg i:nth-child(2) { top: 58%; transform: rotate(6deg); opacity: .4; }
@media (prefers-reduced-motion: no-preference) {
  .bg i:nth-child(1) { animation: drift 26s var(--ease) infinite alternate; }
  .bg i:nth-child(2) { animation: drift 34s var(--ease) infinite alternate-reverse; }
  @keyframes drift { to { translate: 12% 6%; } }
}

.glass { position: relative; isolation: isolate; border-radius: var(--r);
  background: linear-gradient(180deg, var(--glass-top) 0%, var(--glass-mid) 45%, var(--glass-bot) 100%);
  -webkit-backdrop-filter: blur(18px) saturate(1.9); backdrop-filter: blur(18px) saturate(1.9);
  box-shadow: inset 0 1px .5px var(--rim), inset 0 0 0 .5px var(--edge), var(--shadow); }
.glass::before { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; padding: 1px; pointer-events: none;
  background: linear-gradient(150deg, var(--rim) 0%, var(--rim-soft) 30%, transparent 50%, var(--rim-soft) 72%, var(--rim) 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }

.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 18px;
  padding: calc(env(safe-area-inset-top, 0px) + 24px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 56px) max(16px, env(safe-area-inset-left, 0px)); }
header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 10px 16px; }
h1 { margin: 0; font-weight: 600; font-size: clamp(28px, 5vw, 42px); letter-spacing: -.02em; line-height: 1.05; }
.sub { margin: 6px 0 0; color: var(--muted); }
.status { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); padding: 8px 14px; border-radius: 999px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
.status.ok .dot { background: var(--good); box-shadow: 0 0 0 4px var(--good-soft); }
.status.warn { color: var(--amber); } .status.warn .dot { background: var(--amber); }

/* Hero */
.hero { display: grid; grid-template-columns: minmax(250px, 330px) 1fr; gap: 18px; padding: 20px; }
@media (max-width: 760px) { .hero { grid-template-columns: 1fr; } }
.gauge { display: grid; justify-items: center; align-content: center; gap: 4px; padding: 4px 0; }
.gauge svg { width: 100%; max-width: 300px; height: auto; overflow: visible; }
.gauge .g-track { stroke: var(--track); }
.gauge .g-fill { stroke: url(#gfill); transition: stroke-dashoffset 1.1s var(--spring); }
.gauge .g-tick { stroke: var(--faint); opacity: .5; }
.gauge .g-num { font-size: 52px; font-weight: 600; fill: var(--ink); letter-spacing: -.03em; }
.gauge .g-cap { font-size: 13px; fill: var(--muted); }
.gauge p { margin: 0; font-size: 13px; color: var(--muted); text-align: center; text-wrap: balance; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-content: center; }
.stat { text-align: left; font: inherit; color: inherit; border: 0; cursor: pointer; padding: 16px 18px; border-radius: var(--r-sm); display: grid; gap: 2px;
  transition: transform .35s var(--spring); }
.stat:hover { transform: translateY(-2px); }
.stat:active { transform: scale(.98); }
.stat[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--tone), var(--shadow); }
.stat .k { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: var(--ink-2); }
.stat .k::before { content: ""; width: 10px; height: 10px; border-radius: 4px; background: var(--tone); }
.stat b { font-size: clamp(34px, 5vw, 46px); font-weight: 600; letter-spacing: -.03em; line-height: 1.05; }
.stat small { color: var(--muted); font-size: 12.5px; }
.minis { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; }
.mini { font-size: 12.5px; color: var(--muted); padding: 6px 12px; border-radius: 999px; background: var(--slate-soft); }
.mini strong { color: var(--ink); font-weight: 600; }

/* Funnel */
.funnel { padding: 18px 20px; display: grid; gap: 12px; }
.funnel h2, .list-head h2 { margin: 0; font-size: 17px; font-weight: 600; }
.bars { display: grid; gap: 8px; }
.bar { display: grid; grid-template-columns: 130px 1fr 44px; align-items: center; gap: 12px; font-size: 13.5px; }
@media (max-width: 520px) { .bar { grid-template-columns: 96px 1fr 36px; } }
.bar span { color: var(--ink-2); }
.bar .tr { height: 12px; border-radius: 999px; background: var(--track); overflow: hidden; }
.bar .fl { height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--tone), color-mix(in srgb, var(--tone) 55%, white)); transition: width .9s var(--spring); }
.bar em { font-style: normal; text-align: right; font-weight: 600; }

/* List */
.list-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: inherit; font-size: 13px; font-weight: 500; color: var(--ink-2); padding: 7px 13px; border-radius: 999px; border: 0; cursor: pointer; transition: transform .3s var(--spring); }
.chip:active { transform: scale(.96); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg-a); box-shadow: none; }
.chip[aria-pressed="true"]::before { display: none; }
.chip em { font-style: normal; opacity: .65; margin-left: 4px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; }
.field { font: inherit; color: var(--ink); background: var(--field); border: 1px solid var(--edge); border-radius: 12px; padding: 9px 12px; min-width: 0; }
.tools .field[type="search"] { flex: 1 1 240px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.rows { display: grid; gap: 10px; }
.row { display: grid; grid-template-columns: 6px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 16px 14px 12px; border-radius: 20px; }
.row .tone { align-self: stretch; border-radius: 999px; background: var(--tone); }
.row .who { display: grid; gap: 3px; min-width: 0; }
.row .co { font-weight: 600; font-size: 16px; overflow-wrap: anywhere; }
.row .ro { color: var(--ink-2); overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12.5px; color: var(--muted); }
.pill { display: inline-flex; align-items: center; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; color: var(--tone); background: var(--tone-soft); }
.fit { font-family: var(--mono); font-size: 12px; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: end; }
.acts select { max-width: 200px; }
.link { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 13.5px; text-decoration: none; color: var(--accent-ink); background: var(--accent-soft); padding: 9px 14px; border-radius: 12px; white-space: nowrap; }
.link:hover { background: color-mix(in srgb, var(--accent) 22%, transparent); }
.link.off { color: var(--faint); background: var(--slate-soft); }
.ghost { font: inherit; font-size: 13.5px; color: var(--ink-2); background: none; border: 1px solid var(--edge); border-radius: 12px; padding: 8px 12px; cursor: pointer; }
@media (max-width: 720px) {
  .row { grid-template-columns: 6px minmax(0, 1fr); }
  .acts { grid-column: 2; justify-content: start; }
  .acts select { flex: 1 1 160px; max-width: none; }
}
.none { padding: 22px; color: var(--muted); text-align: center; border-radius: 20px; }
.empty { padding: 26px; display: grid; gap: 8px; max-width: 70ch; }
.empty h2 { margin: 0; font-size: 22px; font-weight: 600; }
.empty p { margin: 0; }
code { font-family: var(--mono); font-size: 12.5px; background: var(--slate-soft); padding: 1px 6px; border-radius: 6px; }

/* Sheet */
.scrim { position: fixed; inset: 0; background: var(--scrim); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }
.sheet { position: fixed; top: 10px; right: 10px; bottom: 10px; width: min(460px, calc(100% - 20px)); overflow-y: auto; border-radius: var(--r);
  --glass-top: color-mix(in srgb, var(--bg-a) 92%, transparent); --glass-mid: color-mix(in srgb, var(--bg-a) 86%, transparent); --glass-bot: color-mix(in srgb, var(--bg-a) 90%, transparent);
  padding: calc(env(safe-area-inset-top, 0px) + 20px) 22px calc(env(safe-area-inset-bottom, 0px) + 24px); display: grid; gap: 18px; align-content: start; }
.sheet h2 { margin: 0; font-size: 24px; font-weight: 600; overflow-wrap: anywhere; }
.sheet h3 { margin: 0; font-size: 15px; font-weight: 600; }
.sheet .top { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
dl { display: grid; grid-template-columns: max-content 1fr; gap: 7px 14px; margin: 0; }
dt { color: var(--muted); } dd { margin: 0; overflow-wrap: anywhere; }
.sheet a { color: var(--accent-ink); }
.timeline { list-style: none; margin: 0; padding: 0 0 0 4px; display: grid; gap: 12px; border-left: 2px solid var(--track); }
.timeline li { padding-left: 16px; position: relative; display: grid; gap: 2px; }
.timeline li::before { content: ""; position: absolute; left: -7px; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--tone, var(--accent)); box-shadow: 0 0 0 3px var(--bg-a); }
.timeline time { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.note { font-size: 12.5px; color: var(--muted); }

.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); translate: -50% 0; z-index: 10;
  display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 18px; border-radius: 999px; font-size: 14px; max-width: calc(100% - 32px); }
.toast button { font: inherit; font-weight: 600; color: var(--accent-ink); background: var(--accent-soft); border: 0; border-radius: 999px; padding: 6px 12px; cursor: pointer; }
@media (prefers-reduced-motion: no-preference) {
  .rise { animation: rise .6s var(--ease) both; }
  .sheet { animation: slide .35s var(--ease); }
  .toast { animation: rise .35s var(--spring); }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  @keyframes slide { from { opacity: .5; transform: translateX(24px); } }
}
</style>

<div class="bg" aria-hidden="true"><i></i><i></i></div>
<div class="wrap">
  <header>
    <div>
      <h1>Mis postulaciones</h1>
      <p class="sub">Tu búsqueda en un solo lugar, igual en tus dos computadores y en el celular.</p>
    </div>
    <div class="status glass" id="st" role="status"><span class="dot"></span><span id="status">Conectando con tus datos…</span></div>
  </header>

  <section class="hero glass rise" aria-label="Resumen">
    <div class="gauge" id="gauge"></div>
    <div class="stats" id="stats"></div>
  </section>

  <section class="funnel glass rise" aria-label="Embudo">
    <h2>Cómo avanzan</h2>
    <div class="bars" id="bars"></div>
  </section>

  <section style="display:grid;gap:12px" aria-label="Listado">
    <div class="list-head">
      <h2>Todas las postulaciones</h2>
      <div class="chips" id="chips"></div>
    </div>
    <div class="tools">
      <input id="q" class="field" type="search" placeholder="Buscar empresa, cargo o portal" aria-label="Buscar">
      <select id="sort" class="field" aria-label="Orden">
        <option value="recent">Movimiento más reciente</option>
        <option value="sent">Fecha de envío</option>
        <option value="fit">Mayor encaje</option>
        <option value="company">Empresa (A-Z)</option>
      </select>
    </div>
    <div class="rows" id="rows"></div>
  </section>
</div>

<script>
(() => {
  const ETAPAS = [
    ["borrador", "Borrador", "drafted"], ["enviada", "Enviada", "applied"], ["en_revision", "En revisión", "applied"],
    ["prueba_tecnica", "Prueba técnica", "interview"], ["entrevista_rrhh", "Entrevista RRHH", "interview"],
    ["entrevista_tecnica", "Entrevista técnica", "interview"], ["entrevista_final", "Entrevista final", "interview"],
    ["oferta", "Oferta", "offer"], ["contratado", "Contratado", "hired"], ["rechazado", "Rechazado", "rejected"],
    ["sin_respuesta", "Sin respuesta", "no_response"], ["oferta_rechazada", "Oferta rechazada", "offer_declined"],
    ["retirada", "Retirada", "withdrawn"]
  ];
  const LABEL = Object.fromEntries(ETAPAS.map(e => [e[0], e[1]]));
  const STATUS = Object.fromEntries(ETAPAS.map(e => [e[0], e[2]]));
  const DEFAULT_ETAPA = { drafted: "borrador", applied: "enviada", interview: "entrevista_rrhh", offer: "oferta", hired: "contratado",
    rejected: "rechazado", no_response: "sin_respuesta", "no response": "sin_respuesta", offer_declined: "oferta_rechazada",
    "offer declined": "oferta_rechazada", withdrawn: "retirada" };
  // Groups that drive the numbers, the colours and the filters.
  const PENDING = new Set(["enviada", "en_revision"]);
  const ADVANCED = new Set(["prueba_tecnica", "entrevista_rrhh", "entrevista_tecnica", "entrevista_final", "oferta", "contratado", "oferta_rechazada"]);
  const RESPONDED = new Set([...ADVANCED, "rechazado"]);
  const CLOSED = new Set(["rechazado", "sin_respuesta", "oferta_rechazada", "retirada", "contratado"]);
  const TONE = e => e === "borrador" ? "slate" : PENDING.has(e) ? "amber" : (e === "oferta" || e === "contratado") ? "good"
    : ADVANCED.has(e) ? "violet" : "coral";
  const toneVars = e => { const t = TONE(e); return `--tone:var(--${t});--tone-soft:var(--${t}-soft)`; };

  let apps = [];
  let db = null;
  let openId = null;
  let filter = "todas";
  const $ = id => document.getElementById(id);
  const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
  filter = store.get("mp-filter") || "todas";

  function el(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === "class") n.className = v; else if (k === "on") for (const [ev, fn] of Object.entries(v)) n.addEventListener(ev, fn); else n.setAttribute(k, v);
    }
    for (const k of kids.flat()) if (k != null && k !== false) n.append(k instanceof Node ? k : String(k));
    return n;
  }
  const SVG = "http://www.w3.org/2000/svg";
  function sv(tag, attrs, ...kids) { const n = document.createElementNS(SVG, tag); for (const [k, v] of Object.entries(attrs || {})) n.setAttribute(k, v); kids.forEach(k => n.append(k)); return n; }
  const str = v => (v == null ? "" : String(v));
  const safeUrl = u => { u = str(u).trim(); return u.startsWith("https://") || u.startsWith("/_blob/") ? u : ""; };
  const parseDate = s => { const t = Date.parse(str(s)); return isNaN(t) ? null : t; };
  const fmtDate = t => t == null ? "" : new Date(t).toLocaleDateString("es-CO", { day: "numeric", month: "short", year: "numeric" });
  const DAY = 864e5;
  const ago = t => { if (t == null) return ""; const d = Math.floor((Date.now() - t) / DAY); return d <= 0 ? "hoy" : d === 1 ? "ayer" : `hace ${d} d`; };

  function normalize(id, d) {
    const events = Array.isArray(d.events) ? d.events.filter(e => e && LABEL[e.etapa]).slice().sort((a, b) => str(a.ts).localeCompare(str(b.ts))) : [];
    const etapa = LABEL[d.etapa] ? d.etapa : (events.length ? events[events.length - 1].etapa : DEFAULT_ETAPA[str(d.status).toLowerCase()] || "borrador");
    const sentEv = events.find(e => e.etapa === "enviada");
    const sent = sentEv ? parseDate(sentEv.ts) : (etapa !== "borrador" ? parseDate(d.date) : null);
    const firstReply = events.find(e => RESPONDED.has(e.etapa));
    const last = events.length ? parseDate(events[events.length - 1].ts) : parseDate(d.updated_at) || parseDate(d.date);
    const fit = typeof d.fit_rating === "number" ? d.fit_rating : (str(d.fit_rating) && !isNaN(+d.fit_rating) ? +d.fit_rating : null);
    const ever = new Set([etapa, ...events.map(e => e.etapa)]);
    return { id, d, events, etapa, sent, last, fit, firstReply: firstReply ? parseDate(firstReply.ts) : null,
      responded: [...ever].some(e => RESPONDED.has(e)), advanced: [...ever].some(e => ADVANCED.has(e)),
      text: [d.company, d.role, d.channel, d.sector, d.source].map(str).join(" ").toLowerCase() };
  }

  const GROUPS = {
    todas: { name: "Todas", test: () => true },
    pendientes: { name: "Pendientes", test: a => PENDING.has(a.etapa) },
    respuesta: { name: "Con respuesta", test: a => a.etapa !== "borrador" && a.responded },
    continuaron: { name: "Continuaron", test: a => a.etapa !== "borrador" && a.advanced },
    cerradas: { name: "Cerradas", test: a => CLOSED.has(a.etapa) },
    borradores: { name: "Borradores", test: a => a.etapa === "borrador" }
  };
  const count = g => apps.filter(GROUPS[g].test).length;

  function countUp(node, to, suffix = "") {
    const from = +(node.dataset.v || 0); node.dataset.v = to;
    if (matchMedia("(prefers-reduced-motion: reduce)").matches || from === to) { node.textContent = to + suffix; return; }
    const t0 = performance.now(), dur = 700;
    const step = now => { const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      node.textContent = Math.round(from + (to - from) * e) + suffix; if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }

  // 220° speedometer, like NutriVerse's calorie gauge: response rate of the sent applications.
  const CX = 150, CY = 150, R = 118, START = 160, SWEEP = 220;
  const pt = (r, deg) => [CX + r * Math.cos(deg * Math.PI / 180), CY + r * Math.sin(deg * Math.PI / 180)];
  const arc = (r, a0, a1) => { const [x0, y0] = pt(r, a0), [x1, y1] = pt(r, a1); return `M${x0.toFixed(1)} ${y0.toFixed(1)}A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`; };
  let gaugeBuilt = null;
  function renderGauge(sentN, repliedN) {
    const box = $("gauge");
    if (!gaugeBuilt) {
      const svg = sv("svg", { viewBox: "0 0 300 240", role: "img", "aria-label": "Tasa de respuesta" });
      const defs = sv("defs", {}, sv("linearGradient", { id: "gfill", x1: "0", y1: "0", x2: "1", y2: "0" },
        sv("stop", { offset: "0", "stop-color": "var(--amber)" }), sv("stop", { offset: ".55", "stop-color": "var(--violet)" }), sv("stop", { offset: "1", "stop-color": "var(--good)" })));
      const track = sv("path", { d: arc(R, START, START + SWEEP), class: "g-track", fill: "none", "stroke-width": "20", "stroke-linecap": "round" });
      const fill = sv("path", { d: arc(R, START, START + SWEEP), class: "g-fill", fill: "none", "stroke-width": "20", "stroke-linecap": "round", pathLength: "1000", "stroke-dasharray": "1000", "stroke-dashoffset": "1000" });
      const ticks = sv("g", {});
      for (let i = 0; i <= 10; i++) { const a = START + SWEEP * i / 10, [x0, y0] = pt(R - 22, a), [x1, y1] = pt(R - (i % 5 ? 27 : 32), a);
        ticks.append(sv("line", { x1: x0, y1: y0, x2: x1, y2: y1, class: "g-tick", "stroke-width": "2", "stroke-linecap": "round" })); }
      const num = sv("text", { x: CX, y: CY + 6, "text-anchor": "middle", class: "g-num" }); num.textContent = "0 %";
      const cap = sv("text", { x: CX, y: CY + 30, "text-anchor": "middle", class: "g-cap" }); cap.textContent = "tasa de respuesta";
      svg.append(defs, track, fill, ticks, num, cap);
      const p = el("p", {});
      box.append(svg, p);
      gaugeBuilt = { fill, num, p };
    }
    const pct = sentN ? Math.round(100 * repliedN / sentN) : 0;
    requestAnimationFrame(() => gaugeBuilt.fill.setAttribute("stroke-dashoffset", String(1000 * (1 - pct / 100))));
    countUp(gaugeBuilt.num, pct, " %");
    gaugeBuilt.p.textContent = sentN ? `${repliedN} de ${sentN} enviadas ya tuvieron respuesta de la empresa` : "Aparece cuando envíes tu primera postulación";
  }

  function renderStats() {
    const sent = apps.filter(a => a.etapa !== "borrador");
    const nRep = count("respuesta"), nCont = count("continuaron"), nPend = count("pendientes");
    renderGauge(sent.length, nRep);
    const box = $("stats");
    const tiles = [
      ["todas", "Total", apps.length, `${sent.length} enviadas · ${count("borradores")} en borrador`, "ink-2"],
      ["continuaron", "Continuaron", nCont, "pasaron a prueba, entrevista u oferta", "violet"],
      ["respuesta", "Con respuesta", nRep, "la empresa ya contestó, sí o no", "good"],
      ["pendientes", "Pendientes", nPend, "enviadas, esperando respuesta", "amber"]
    ];
    if (!box.childElementCount) {
      for (const [g, k] of tiles) box.append(el("button", { class: "stat glass", type: "button", "data-g": g, on: { click: () => setFilter(filter === g ? "todas" : g, true) } },
        el("span", { class: "k" }, k), el("b", {}, "0"), el("small", {})));
      box.append(el("div", { class: "minis", id: "minis" }));
    }
    for (const [g, , v, s, tone] of tiles) {
      const b = box.querySelector(`[data-g="${g}"]`);
      b.style.setProperty("--tone", `var(--${tone === "ink-2" ? "ink-2" : tone})`);
      b.setAttribute("aria-pressed", String(filter === g && g !== "todas"));
      countUp(b.querySelector("b"), v); b.querySelector("small").textContent = s;
    }
    const waits = sent.filter(a => a.sent != null && a.firstReply != null).map(a => (a.firstReply - a.sent) / DAY).sort((x, y) => x - y);
    const median = waits.length ? Math.round(waits[Math.floor((waits.length - 1) / 2)]) : null;
    const week = sent.filter(a => a.sent != null && Date.now() - a.sent < 7 * DAY).length;
    const offers = apps.filter(a => a.etapa === "oferta" || a.etapa === "contratado").length;
    const minis = $("minis"); minis.replaceChildren();
    const mini = (label, v) => minis.append(el("span", { class: "mini" }, label + " ", el("strong", {}, v)));
    mini("Esta semana", week); mini("Ofertas", offers); mini("Cerradas", count("cerradas"));
    mini("Días a la 1.ª respuesta", median == null ? "–" : median);
  }

  function renderBars() {
    const sent = apps.filter(a => a.etapa !== "borrador").length;
    const rows = [["Enviadas", sent, "ink-2"], ["Con respuesta", count("respuesta"), "good"], ["Continuaron", count("continuaron"), "violet"],
      ["Oferta", apps.filter(a => a.etapa === "oferta" || a.etapa === "contratado" || a.etapa === "oferta_rechazada").length, "good"],
      ["Pendientes", count("pendientes"), "amber"], ["Cerradas", count("cerradas"), "coral"]];
    const box = $("bars");
    if (!box.childElementCount) for (const [k] of rows) box.append(el("div", { class: "bar" }, el("span", {}, k), el("div", { class: "tr" }, el("div", { class: "fl" })), el("em", {}, "0")));
    const max = Math.max(1, sent);
    rows.forEach(([, v, tone], i) => { const r = box.children[i]; r.style.setProperty("--tone", `var(--${tone})`);
      requestAnimationFrame(() => { r.querySelector(".fl").style.width = (100 * Math.min(v, max) / max) + "%"; });
      countUp(r.querySelector("em"), v); });
  }

  function setFilter(g, scroll) {
    filter = g; store.set("mp-filter", g); render();
    if (scroll) $("chips").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
  }

  function stageSelect(a, onPick) {
    const sel = el("select", { class: "field", "aria-label": `Etapa de ${str(a.d.company)}` });
    for (const [k, label] of ETAPAS) { const o = el("option", { value: k }, label); if (k === a.etapa) o.selected = true; sel.append(o); }
    sel.disabled = !db;
    sel.addEventListener("change", () => onPick(sel.value, sel));
    return sel;
  }

  function row(a) {
    const meta = el("div", { class: "meta" }, el("span", { class: "pill" }, LABEL[a.etapa]));
    if (str(a.d.channel)) meta.append(el("span", {}, str(a.d.channel)));
    if (a.sent != null) meta.append(el("span", {}, "Enviada " + fmtDate(a.sent)));
    if (a.last != null) meta.append(el("span", {}, "Movida " + ago(a.last)));
    if (a.fit != null) meta.append(el("span", { class: "fit", title: "Encaje con tu perfil" }, `encaje ${Math.round(a.fit)}`));
    const src = safeUrl(a.d.source);
    const link = src ? el("a", { class: "link", href: src, target: "_blank", rel: "noopener noreferrer" }, "Abrir vacante ↗")
      : el("span", { class: "link off", title: "Esta postulación no tiene link guardado" }, "Sin link");
    return el("article", { class: "row glass", style: toneVars(a.etapa) },
      el("span", { class: "tone", "aria-hidden": "true" }),
      el("div", { class: "who" }, el("span", { class: "co" }, str(a.d.company) || "Empresa sin nombre"), el("span", { class: "ro" }, str(a.d.role) || "Cargo sin nombre"), meta),
      el("div", { class: "acts" }, link, stageSelect(a, (etapa, sel) => move(a, etapa, sel)),
        el("button", { class: "ghost", type: "button", on: { click: () => openSheet(a.id) } }, "Detalle")));
  }

  function renderChips() {
    const box = $("chips"); box.replaceChildren();
    for (const [g, { name }] of Object.entries(GROUPS))
      box.append(el("button", { class: "chip glass", type: "button", "aria-pressed": String(filter === g), on: { click: () => setFilter(g) } }, name, el("em", {}, count(g))));
  }

  function render() {
    renderStats(); renderBars(); renderChips();
    const box = $("rows"); box.replaceChildren();
    if (!apps.length) {
      box.append(el("div", { class: "empty glass" },
        el("h2", {}, "Aún no hay postulaciones aquí"),
        el("p", {}, "En Claude Code, en cualquiera de tus computadores, pega el link de una vacante con ", el("code", {}, "/postular"), ". Cuando termine, ", el("code", {}, "/sincronizar"), " la sube y aparece en este tablero."),
        el("p", { class: "note" }, "Las que ya tengas en tu registro local también suben con /sincronizar.")));
      return;
    }
    const q = $("q").value.trim().toLowerCase();
    const by = { recent: (x, y) => (y.last || 0) - (x.last || 0), sent: (x, y) => (y.sent || 0) - (x.sent || 0),
      fit: (x, y) => (y.fit ?? -1) - (x.fit ?? -1), company: (x, y) => str(x.d.company).localeCompare(str(y.d.company), "es") }[$("sort").value];
    const list = apps.filter(a => GROUPS[filter].test(a) && (!q || a.text.includes(q))).sort(by);
    if (!list.length) { box.append(el("div", { class: "none glass" }, q ? "Ninguna postulación coincide con la búsqueda." : `No hay postulaciones en «${GROUPS[filter].name}».`)); return; }
    list.forEach(a => box.append(row(a)));
  }

  function isoNow() {
    const d = new Date(), off = -d.getTimezoneOffset(), sign = off >= 0 ? "+" : "-", p = n => String(Math.floor(Math.abs(n))).padStart(2, "0");
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}${sign}${p(off / 60)}:${p(off % 60)}`;
  }

  let toastTimer = null;
  function toast(text, action) {
    document.querySelectorAll(".toast").forEach(n => n.remove()); clearTimeout(toastTimer);
    const t = el("div", { class: "toast glass", role: "status" }, el("span", {}, text));
    if (action) t.append(el("button", { type: "button", on: { click: () => { t.remove(); action.run(); } } }, action.label));
    document.body.append(t); toastTimer = setTimeout(() => t.remove(), 6000);
  }

  const errText = err => err && err.code === "permission_denied" ? "Solo tú puedes cambiar etapas en este tablero." : "No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.";

  // Each move appends a "manual" event; /sincronizar brings it back to the tracker on each computer.
  async function move(a, etapa, sel) {
    if (!db || etapa === a.etapa) return;
    const prev = { events: a.events, etapa: a.etapa, status: STATUS[a.etapa] || str(a.d.status), updated_at: str(a.d.updated_at), updated_by: str(a.d.updated_by) };
    const ev = { ts: isoNow(), etapa, status: STATUS[etapa], fuente: "manual", detalle: "Cambio hecho desde el tablero", ref: "" };
    if (sel) sel.disabled = true;
    try {
      await db.doc("postulaciones/" + a.id).update({ events: [...a.events, ev], etapa, status: STATUS[etapa], updated_at: ev.ts, updated_by: "dashboard" });
      toast(`${str(a.d.company) || "Postulación"}: ${LABEL[etapa]}`, { label: "Deshacer", run: async () => {
        try { await db.doc("postulaciones/" + a.id).update(prev); toast("Cambio deshecho"); } catch (err) { toast(errText(err)); }
      } });
    } catch (err) {
      toast(errText(err)); if (sel) sel.value = a.etapa;
    } finally { if (sel) sel.disabled = false; }
  }

  function closeSheet() { openId = null; document.querySelectorAll(".scrim,.sheet").forEach(n => n.remove()); }

  function openSheet(id) {
    const keepScroll = document.querySelector(".sheet")?.scrollTop || 0;
    closeSheet();
    const a = apps.find(x => x.id === id); if (!a) return;
    openId = id;
    const d = a.d;
    const info = el("dl", {});
    const add = (k, v) => { if (v instanceof Node || str(v)) info.append(el("dt", {}, k), el("dd", {}, v)); };
    add("Etapa", LABEL[a.etapa]);
    add("Encaje", a.fit != null ? `${Math.round(a.fit)}/100` : "");
    add("Enviada", a.sent != null ? fmtDate(a.sent) : "");
    add("Canal", d.channel); add("Sector", d.sector); add("Contacto", d.contact_person);
    add("Fecha límite", parseDate(d.deadline) != null ? fmtDate(parseDate(d.deadline)) : "");
    const src = safeUrl(d.source); if (src) add("Vacante", el("a", { href: src, target: "_blank", rel: "noopener noreferrer" }, "Abrir la vacante ↗"));
    const pdf = safeUrl(d.cv_pdf_url); if (pdf) add("Hoja de vida", el("a", { href: pdf, target: "_blank", rel: "noopener noreferrer" }, "Ver el PDF enviado"));
    else add("Hoja de vida", d.cv_file);
    add("Notas", d.notes);

    const tl = el("ol", { class: "timeline" });
    if (!a.events.length) tl.append(el("li", {}, el("span", { class: "note" }, "Sin historial todavía. Aparece cuando /postular, /outcome, /gmail-sync o este tablero registren una etapa.")));
    for (const e of a.events.slice().reverse()) {
      const t = parseDate(e.ts);
      tl.append(el("li", { style: toneVars(e.etapa) }, el("time", {}, t != null ? fmtDate(t) : str(e.ts)), el("strong", {}, LABEL[e.etapa]),
        str(e.detalle) ? el("span", {}, str(e.detalle)) : null, el("span", { class: "note" }, "Fuente: " + str(e.fuente))));
    }

    const sheet = el("aside", { class: "sheet glass", role: "dialog", "aria-modal": "true", "aria-label": str(d.company), style: toneVars(a.etapa) },
      el("div", { class: "top" }, el("div", {}, el("h2", {}, str(d.company) || "Empresa sin nombre"), el("p", { class: "sub" }, str(d.role))),
        el("button", { class: "ghost", type: "button", on: { click: closeSheet } }, "Cerrar")),
      info,
      el("div", { style: "display:grid;gap:8px" }, el("h3", {}, "Cambiar etapa"), stageSelect(a, (etapa, sel) => move(a, etapa, sel))),
      el("div", { style: "display:grid;gap:12px" }, el("h3", {}, "Historial"), tl));
    document.body.append(el("div", { class: "scrim", on: { click: closeSheet } }), sheet);
    sheet.scrollTop = keepScroll;
  }

  document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
  $("q").addEventListener("input", render);
  $("sort").addEventListener("change", render);
  if (!GROUPS[filter]) filter = "todas";
  render();

  (async () => {
    const status = $("status"), pill = $("st");
    try { db = await window.claude?.use?.("db"); } catch { db = null; }
    if (!db) { status.textContent = "Ábrelo con tu cuenta de Claude para ver tus datos"; pill.classList.add("warn"); return; }
    const timer = setTimeout(() => { status.textContent = "Sin conexión todavía; los datos pueden estar desactualizados"; pill.classList.add("warn"); }, 10000);
    db.collection("postulaciones").onSnapshot(snap => {
      if (!snap.fromCache) { clearTimeout(timer); pill.classList.remove("warn"); pill.classList.add("ok");
        status.textContent = "Al día · " + new Date().toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit" }); }
      apps = snap.docs.map(s => normalize(s.id, s.data() || {}));
      render();
      if (openId) openSheet(openId);
    }, err => { clearTimeout(timer); pill.classList.add("warn"); status.textContent = "No se pudieron leer tus datos (" + str(err && err.code) + ")"; });
  })();
})();
</script>
